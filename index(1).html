<title>${svgIcon("daily",22)} 上岸计划</title>
<style>
  :root{
    --pink-0:#fff5fa;
    --pink-1:#ffe9f3;
    --pink-2:#ffd9e8;
    --pink-3:#ffb6d5;
    --pink-4:#ff8fbe;
    --pink-deep:#e56fa0;
    --pink-text:#9a4f74;
    --purple-soft:#e6d4f7;
    --mint:#bdeed8;
    --mint-deep:#5fbf95;
    --sky:#bfe3ff;
    --sun:#ffe2a8;
    --card:#fff9fc;
    --shadow:0 8px 22px rgba(229,111,160,.18);
    --shadow-sm:0 4px 12px rgba(229,111,160,.14);
    --radius:22px;
    --radius-sm:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif;
    color:var(--pink-text);
    background:
      radial-gradient(1200px 600px at 10% -10%, #ffe1ef 0%, transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, #efe2ff 0%, transparent 55%),
      linear-gradient(160deg,#ffe9f3 0%, #fff2f8 45%, #f5ecff 100%);
    background-attachment:fixed;
    overflow:hidden;
  }
  /* floating bunnies */
  .bg-deco{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .bg-deco span{position:absolute; font-size:34px; opacity:.10; animation:floaty 9s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-22px) rotate(6deg);}}

  .phone{
    position:relative; z-index:1;
    max-width:440px; height:100vh; margin:0 auto;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.25));
    box-shadow:0 0 0 1px rgba(255,255,255,.5), 0 30px 80px rgba(214,92,149,.25);
    display:flex; flex-direction:column; overflow:hidden;
  }
  @media(min-width:520px){
    body{padding:18px 0; display:flex; align-items:center; justify-content:center;}
    .phone{height:calc(100vh - 36px); max-height:920px; border-radius:38px;
      box-shadow:0 0 0 10px #fff, 0 0 0 12px #ffd0e4, 0 40px 90px rgba(214,92,149,.35);}
  }

  /* Top bar */
  .topbar{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:14px 14px 12px; background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.35));
    backdrop-filter:blur(8px); border-bottom:1px solid rgba(255,182,213,.4);
  }
  .ham{display:none; border:none; background:var(--pink-2); width:38px;height:38px;border-radius:14px;font-size:18px;color:var(--pink-deep);cursor:pointer;box-shadow:var(--shadow-sm);}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--pink-deep);}
  .logo svg{width:30px;height:30px;}
  .spacer{flex:1;}
  .sync-pill{
    display:flex;align-items:center;gap:7px; padding:7px 12px; border-radius:999px;
    font-size:12.5px; font-weight:700; cursor:pointer; border:none; transition:.2s;
  }
  .sync-pill.on{background:linear-gradient(180deg,#c8f3dc,#a6ecc6); color:#1f7a52; box-shadow:0 4px 12px rgba(95,191,149,.35);}
  .sync-pill.off{background:linear-gradient(180deg,#ece4ea,#dcd2da); color:#8a7c86; box-shadow:var(--shadow-sm);}
  .sync-dot{width:9px;height:9px;border-radius:50%;}
  .sync-pill.on .sync-dot{background:#2fae73; box-shadow:0 0 0 4px rgba(47,174,115,.25); animation:pulse 1.6s infinite;}
  .sync-pill.off .sync-dot{background:#b3a7af;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,174,115,.45);}100%{box-shadow:0 0 0 8px rgba(47,174,115,0);}}

  /* Body */
  .body{flex:1; display:flex; min-height:0;}

  /* Side nav */
  .sidenav{
    flex:0 0 132px; background:linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,225,240,.5));
    border-right:1px solid rgba(255,182,213,.35); padding:10px 8px; overflow-y:auto;
  }
  .nav-group-title{font-size:11px;font-weight:800;color:var(--pink-4);margin:12px 6px 6px;letter-spacing:1px;}
  .nav-group-title:first-child{margin-top:2px;}
  .nav-item{
    display:flex;align-items:center;gap:8px; padding:9px 8px; margin:3px 0; border-radius:14px;
    cursor:pointer; font-size:13px; font-weight:600; color:var(--pink-text);
    background:rgba(255,255,255,.5); border:1px solid transparent; transition:.15s; user-select:none;
  }
  .nav-item:hover{background:#fff; transform:translateX(2px);}
  .nav-item.active{background:#fff; border-color:var(--pink-3); color:var(--pink-deep); box-shadow:var(--shadow-sm);}
  .nav-item .ic{font-size:18px;width:22px;text-align:center;}
  .nav-item .drag{margin-left:auto; opacity:.35; cursor:grab; font-size:12px; line-height:1;}
  .nav-item.dragging{opacity:.45;}
  .nav-item.drop-before{box-shadow:0 -3px 0 var(--pink-4);}

  /* Content */
  .content{flex:1; overflow-y:auto; padding:14px 14px 26px; -webkit-overflow-scrolling:touch;}
  .content::-webkit-scrollbar,.sidenav::-webkit-scrollbar{width:0;}
  .view-title{font-size:20px;font-weight:800;color:var(--pink-deep);margin:2px 2px 12px;display:flex;align-items:center;gap:8px;}
  .view-sub{font-size:12px;color:#c08bab;font-weight:600;}

  .card{background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); margin-bottom:14px; border:1px solid rgba(255,182,213,.4);}
  .card-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--pink-deep);font-size:15px;margin-bottom:10px;}
  .card-h .sub{font-size:11px;color:#c08bab;font-weight:600;margin-left:auto;}

  .btn{border:none;border-radius:14px;padding:10px 14px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;}
  .btn:active{transform:scale(.96);}
  .btn-pink{background:linear-gradient(180deg,var(--pink-3),var(--pink-4));color:#fff;box-shadow:0 6px 14px rgba(255,143,190,.4);}
  .btn-soft{background:var(--pink-2);color:var(--pink-deep);}
  .btn-mint{background:linear-gradient(180deg,#bdeed8,#9fe6c2);color:#1f7a52;box-shadow:0 6px 14px rgba(95,191,149,.35);}
  .btn-ghost{background:rgba(255,255,255,.7);color:var(--pink-text);border:1px solid var(--pink-2);}
  .btn-sm{padding:7px 11px;font-size:12px;border-radius:11px;}
  .btn-block{width:100%;justify-content:center;}

  .empty{text-align:center;color:#c79ab4;font-size:13px;padding:18px 8px;}
  .empty .big{font-size:34px;display:block;margin-bottom:6px;}

  /* Exam countdown */
  .exam-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .exam-card{background:linear-gradient(180deg,#fff,#fff2f8);border-radius:18px;padding:12px;position:relative;box-shadow:var(--shadow-sm);border:1px solid rgba(255,182,213,.35);overflow:hidden;}
  .exam-card .type{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--purple-soft);color:#8a5bc4;display:inline-block;margin-bottom:6px;}
  .exam-card .name{font-weight:800;font-size:14px;color:var(--pink-deep);}
  .exam-card .date{font-size:11px;color:#bb8caa;margin-top:2px;}
  .exam-card .count{margin-top:8px;font-weight:900;font-size:30px;color:var(--pink-4);line-height:1;}
  .exam-card .count small{font-size:12px;font-weight:700;color:#c08bab;}
  .exam-card .del{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.7);border:none;border-radius:8px;width:24px;height:24px;cursor:pointer;color:#d57;font-size:13px;}

  /* Daily checkin */
  .streak-box{display:flex;align-items:center;gap:14px;}
  .streak-num{font-size:34px;font-weight:900;color:var(--pink-4);}
  .ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--pink-4) calc(var(--p,0)*1%), #ffe1ef 0);display:flex;align-items:center;justify-content:center;}
  .ring i{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-style:normal;}

  /* Plan list */
  .plan-row{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px dashed rgba(255,182,213,.5);}
  .plan-row:last-child{border-bottom:none;}
  .check{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--pink-3);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px;}
  .check.done{background:var(--mint-deep);border-color:var(--mint-deep);}
  .plan-text{flex:1;font-size:13.5px;line-height:1.4;}
  .plan-text.done{text-decoration:line-through;color:#c2a9bb;}
  .plan-meta{font-size:10.5px;color:#c79ab4;margin-top:2px;}
  .plan-mod{font-size:10.5px;font-weight:700;color:var(--pink-4);background:var(--pink-2);padding:1px 7px;border-radius:999px;margin-right:5px;}

  /* Sub tabs */
  .subtabs{display:flex;gap:6px;background:var(--pink-1);padding:5px;border-radius:16px;margin-bottom:14px;}
  .subtab{flex:1;text-align:center;padding:8px 4px;border-radius:12px;font-size:12.5px;font-weight:700;color:#c08bab;cursor:pointer;transition:.15s;}
  .subtab.active{background:#fff;color:var(--pink-deep);box-shadow:var(--shadow-sm);}

  /* Stat cards */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .stat{background:linear-gradient(180deg,#fff,#fff4fa);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow-sm);}
  .stat .v{font-size:20px;font-weight:900;color:var(--pink-4);}
  .stat .l{font-size:10.5px;color:#bb8caa;margin-top:2px;}

  /* Period & metric toggles */
  .seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:54px;border:1px solid var(--pink-2);background:rgba(255,255,255,.6);border-radius:12px;padding:7px;font-size:12.5px;font-weight:700;color:#c08bab;cursor:pointer;}
  .seg button.active{background:var(--pink-3);color:#fff;border-color:var(--pink-3);}

  .chart{width:100%;height:170px;display:block;}

  /* Records list */
  .rec{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed rgba(255,182,213,.5);font-size:12.5px;}
  .rec:last-child{border-bottom:none;}
  .rec .bar{flex:1;}
  .rec .acc{font-weight:800;color:var(--pink-4);}
  .rec .del{background:none;border:none;color:#e08;cursor:pointer;font-size:14px;}
  .tag{font-size:10.5px;background:var(--pink-2);color:var(--pink-deep);padding:2px 7px;border-radius:999px;font-weight:700;}

  /* Wrong items */
  .wrong{background:linear-gradient(180deg,#fff,#fff6fb);border-radius:14px;padding:10px;margin-bottom:9px;box-shadow:var(--shadow-sm);border:1px solid rgba(255,182,213,.3);}
  .wrong .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .wrong .k{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff;}
  .k.text{background:#ff9ec4;} .k.photo{background:#9ec9ff;} .k.voice{background:#b89cff;}
  .wrong .date{font-size:10.5px;color:#bb8caa;margin-left:auto;}
  .wrong .txt{font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .wrong img{max-width:100%;border-radius:12px;margin-top:6px;display:block;}
  .voice-bar{display:flex;align-items:center;gap:8px;background:var(--purple-soft);border-radius:12px;padding:8px 10px;margin-top:6px;}
  .voice-bar button{border:none;background:#fff;border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--pink-deep);}
  .voice-wave{display:flex;gap:2px;align-items:center;height:20px;}
  .voice-wave i{width:3px;background:var(--pink-4);border-radius:2px;animation:vw 1s infinite;}
  @keyframes vw{0%,100%{height:5px;}50%{height:18px;}}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(120,40,80,.35);backdrop-filter:blur(2px);z-index:50;display:none;}
  .overlay.show{display:block;}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(92vw,420px);max-height:88vh;overflow:auto;z-index:51;display:none;}
  .modal.show{display:block;animation:pop .25s ease;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-40%) scale(.94);}to{opacity:1;transform:translate(-50%,-46%) scale(1);}}
  .modal-card{background:var(--card);border-radius:26px;padding:18px;box-shadow:0 30px 70px rgba(214,92,149,.4);border:1px solid rgba(255,182,213,.5);}
  .modal-h{font-weight:800;color:var(--pink-deep);font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .modal-h .x{margin-left:auto;background:var(--pink-2);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--pink-deep);font-size:15px;}
  label.fld{display:block;font-size:12px;font-weight:700;color:#b06a90;margin:10px 0 5px;}
  input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--pink-2);border-radius:13px;padding:11px 12px;font-size:14px;color:var(--pink-text);background:#fff;outline:none;font-family:inherit;}
  input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pink-4);box-shadow:0 0 0 3px rgba(255,143,190,.2);}
  textarea.in{resize:vertical;min-height:74px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .picker{display:flex;gap:6px;margin-bottom:8px;}
  .picker button{flex:1;border:1.5px solid var(--pink-2);background:#fff;border-radius:12px;padding:9px;font-size:13px;font-weight:700;color:#c08bab;cursor:pointer;}
  .picker button.active{background:var(--pink-3);color:#fff;border-color:var(--pink-3);}
  .photo-prev{margin-top:8px;}
  .photo-prev img{width:100%;border-radius:12px;}
  .rec-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px solid var(--pink-3);background:#fff;border-radius:14px;padding:13px;font-weight:700;color:var(--pink-deep);cursor:pointer;}
  .rec-btn.recording{background:#ff6b9d;color:#fff;border-color:#ff6b9d;animation:flash 1s infinite;}
  @keyframes flash{50%{opacity:.7;}}
  .mic-btn{border:none;background:var(--pink-2);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px;}
  .hint{font-size:11px;color:#c79ab4;margin-top:4px;}

  /* Sync panel big */
  .sync-banner{border-radius:20px;padding:18px;text-align:center;margin-bottom:14px;color:#fff;font-weight:800;}
  .sync-banner.on{background:linear-gradient(180deg,#7fd6a6,#4cbf86);box-shadow:0 10px 24px rgba(76,191,134,.4);}
  .sync-banner.off{background:linear-gradient(180deg,#cdbcc9,#b3a1af);box-shadow:var(--shadow-sm);}
  .sync-banner .ic{font-size:40px;display:block;margin-bottom:6px;}
  .sync-banner .st{font-size:18px;}
  .sync-banner .ds{font-size:12px;font-weight:600;opacity:.92;margin-top:3px;}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(60,20,40,.85);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:99;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 移动端也保持左侧纵向导航栏常驻（符合需求），仅微调宽度 */
  @media(max-width:760px){
    .sidenav{flex:0 0 116px; padding:8px 5px;}
    .nav-item{font-size:12px; padding:8px 6px;}
    .nav-item .ic{font-size:16px; width:18px;}
    .nav-item .drag{display:none;}
    .nav-group-title{font-size:10px;}
    .content{padding:12px 10px 24px;}
  }
.app-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 3px 10px rgba(229,111,160,.35);background:#fff;}
</style>

function svgIcon(name,size=20,color="#e56fa0"){
  const p=SVG_ICONS[name]||"";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0;">${p}</svg>`;

const ALL_IDS = MODULES.flatMap(g=>g.items.map(i=>i.id));
const GEN_IDS = ALL_IDS.filter(id=>id!=="daily" && id!=="taojuan");
const NAV_DEFAULT = ALL_IDS.slice();
const NAME_OF = {}; MODULES.forEach(g=>g.items.forEach(i=>NAME_OF[i.id]=i.name));
const ICON_OF = {}; MODULES.forEach(g=>g.items.forEach(i=>ICON_OF[i.id]=i.icon));

/* ---------- state ---------- */
let state = null;
function defaultState(){
  const modules = {};
  GEN_IDS.forEach(id=> modules[id] = { plans:[], records:[], wrongs:[], checkins:{} });
  return {
    exams:[],
    navOrder: NAV_DEFAULT.slice(),
    sync:{ connected:false, device:"我的小兔机" },
    dailyCheckins:{},        // {date:true}
    modules,
    papers:[]
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ console.warn("读取失败",e); }
  if(!state) state = defaultState();
  // 容错补全
  const def = defaultState();
  if(!state.navOrder) state.navOrder = NAV_DEFAULT.slice();
  if(!state.modules) state.modules = {};
  GEN_IDS.forEach(id=>{ if(!state.modules[id]) state.modules[id] = def.modules[id]; });
  if(!state.papers) state.papers=[];
  if(!state.exams) state.exams=[];
  if(!state.dailyCheckins) state.dailyCheckins={};
  if(!state.sync) state.sync=def.sync;
}
let saveTimer=null;
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){
    toast("保存失败：本地空间不足，建议减少照片/语音 ✂️");
    console.warn(e);
  }
}
function autoSave(){ saveState(); toast("已自动保存"); }

/* ---------- utils ---------- */
const $ = sel=>document.querySelector(sel);
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function todayStr(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function weekKey(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x.getFullYear()+"-W"+String(Math.ceil((x.getDate())/7)).padStart(2,"0")+" "+x.getMonth()+1+"月"; }
function monthKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"月"; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function fmtDateShort(s){ const p=s.split("-"); return p[1]+"-"+p[2]; }

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600);
}

/* ---------- nav & routing ---------- */
let currentView = "daily";
let ui = { tab:"plan", period:"day", metric:"count" };

function renderNav(){
  const order = state.navOrder.filter(id=>ALL_IDS.includes(id));
  let html="";
  let lastGroup=null;
  order.forEach(id=>{
    const grp = MODULES.find(g=>g.items.some(i=>i.id===id)).group;
    if(grp!==lastGroup){ html+=`<div class="nav-group-title">${grp}</div>`; lastGroup=grp; }
    const it = MODULES.flatMap(g=>g.items).find(i=>i.id===id);
    html+=`<div class="nav-item ${id===currentView?"active":""}" draggable="true" data-action="nav" data-view="${id}">
      <span class="ic">${svgIcon(it.icon,18)}</span><span>${it.name}</span><span class="drag" title="拖拽排序">⋮⋮</span>
    </div>`;
  });
  const nav=$("#sidenav"); nav.innerHTML=html;
  // drag events
  let dragId=null;
  nav.querySelectorAll(".nav-item").forEach(el=>{
    el.addEventListener("dragstart",e=>{ dragId=el.dataset.view; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); nav.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("drop-before")); });
    el.addEventListener("dragover",e=>{ e.preventDefault(); if(el.dataset.view===dragId) return; nav.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("drop-before")); el.classList.add("drop-before"); });
    el.addEventListener("drop",e=>{
      e.preventDefault();
      const target=el.dataset.view;
      if(!dragId||dragId===target) return;
      const arr=state.navOrder.filter(id=>ALL_IDS.includes(id));
      const from=arr.indexOf(dragId), to=arr.indexOf(target);
      arr.splice(from,1); arr.splice(to,0,dragId);
      // 合并回完整顺序（保留可能的重复）
      state.navOrder=arr;
      saveState(); renderNav();
    });
  });
}

/* ---------- charts ---------- */
function drawLineChart(canvas, points, color, fill){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth||300, h=canvas.clientHeight||170;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!points.length){ ctx.fillStyle="#c98aa8"; ctx.font="14px sans-serif"; ctx.textAlign="center"; ctx.fillText("暂无数据",w/2,h/2); return; }
  const pad=30, maxV=Math.max(...points.map(p=>p.value),1), minV=0, n=points.length;
  const xStep=n>1?(w-2*pad)/(n-1):0;
  const X=i=> n>1? pad+i*xStep : w/2;
  const Y=v=> h-pad-(v-minV)/(maxV-minV)*(h-2*pad);
  // grid
  ctx.strokeStyle="rgba(255,182,213,.35)"; ctx.lineWidth=1;
  for(let g=0;g<=4;g++){ const gy=pad+(h-2*pad)*g/4; ctx.beginPath(); ctx.moveTo(pad,gy); ctx.lineTo(w-pad,gy); ctx.stroke(); }
  // fill
  const grad=ctx.createLinearGradient(0,pad,0,h-pad); grad.addColorStop(0,fill); grad.addColorStop(1,"rgba(255,255,255,0)");
  ctx.beginPath(); ctx.moveTo(X(0),Y(points[0].value));
  for(let i=1;i<n;i++) ctx.lineTo(X(i),Y(points[i].value));
  ctx.lineTo(X(n-1),h-pad); ctx.lineTo(X(0),h-pad); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  // line
  ctx.beginPath(); ctx.moveTo(X(0),Y(points[0].value));
  for(let i=1;i<n;i++) ctx.lineTo(X(i),Y(points[i].value));
  ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineJoin="round"; ctx.stroke();
  // dots + labels
  for(let i=0;i<n;i++){
    ctx.beginPath(); ctx.arc(X(i),Y(points[i].value),4,0,7); ctx.fillStyle=color; ctx.fill();
    ctx.fillStyle="#a85d7e"; ctx.font="10px sans-serif"; ctx.textAlign="center";
    ctx.fillText(points[i].label, X(i), h-9);
  }
}
function renderCharts(){
  document.querySelectorAll("canvas.chart").forEach(cv=>{
    try{
      const pts=JSON.parse(cv.dataset.points||"[]");
      drawLineChart(cv, pts, cv.dataset.color||"#ff8fbe", cv.dataset.fill||"rgba(255,143,190,.3)");
    }catch(e){ console.warn(e); }
  });
}

/* ---------- aggregation ---------- */
function aggBy(records, period, getter){
  const map={};
  records.forEach(r=>{
    const d=new Date(r.date); let key;
    if(period==="day") key=r.date;
    else if(period==="week") key=weekKey(d);
    else key=monthKey(d);
    if(!map[key]) map[key]={label:key,value:0};
    map[key].value += getter(r);
  });
  return Object.keys(map).sort().map(k=>({label:map[k].label, value:+map[k].value.toFixed(2)}));
}
function accSeries(records, period){
  const map={};
  records.forEach(r=>{
    const d=new Date(r.date); let key= period==="day"?r.date : period==="week"?weekKey(d):monthKey(d);
    if(!map[key]) map[key]={c:0,t:0,label:key};
    map[key].c+=r.correct; map[key].t+=r.count;
  });
  return Object.keys(map).sort().map(k=>({label:map[k].label, value: map[k].t? +(map[k].c/map[k].t*100).toFixed(1):0}));
}

  return { t, c, acc: t? +(c/t*100).toFixed(1):0 };
}

        <div style="font-size:12px;color:#bb8caa;">本机：${esc(state.sync.device)}</div>
      </div>
      <button class="btn ${on?"btn-soft":"btn-mint"}" data-action="toggleSync">${on?"断开":"连接"}</button>
    </div>
    <div style="margin-top:12px;font-size:11.5px;color:#c08bab;line-height:1.6;">
      💡 说明：本应用数据默认保存在本机（localStorage）。点击「连接」即视为开启多设备同步模式；
      跨设备迁移可通过下方的「导出 / 导入」完成。
    </div>
  </div>
  <div class="card">
    <div class="card-h">📤 数据迁移（导出 / 导入）</div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-pink" style="flex:1;" data-action="exportData">导出备份</button>
      <button class="btn btn-soft" style="flex:1;" data-action="importData">导入备份</button>

    <div class="hint">导出会下载一个 .json 文件，换设备后导入即可恢复全部内容。</div>
  </div>
  `;
}

  $("#modalCard").innerHTML=html;
  $("#overlay").classList.add("show");
  $("#modal").classList.add("show");
}
function closeModal(){
  $("#overlay").classList.remove("show");
  $("#modal").classList.remove("show");
  pendingVoice=null;
}
window.closeModal=closeModal;

let pendingVoice=null; // dataURL for voice wrong

  openModal(`
    <div class="modal-h">${svgIcon("add",14)} 记录错题 <button class="x" data-action="closeModal">×</button></div>
    <div class="picker" id="wrPicker">
      <button class="active" data-type="text">✍️ 文字</button>

    <div id="wrBody">

    <button class="btn btn-pink btn-block" style="margin-top:14px;" data-action="saveWrong" data-mod="${mod}">保存 🐞</button>
  `);

    else if(t==="photo") body.innerHTML=`<label class="fld">拍张照 📷</label><input class="in" type="file" accept="image/*" capture="environment" id="wrPhoto"/><div class="photo-prev" id="wrPrev"></div>`;
    else body.innerHTML=`<label class="fld">录一段语音 🎙️</label><button class="rec-btn" id="wrRec">● 点击开始录音</button><div class="photo-prev" id="wrPrev"></div>`;
    attachVoiceRec();
    const ph=$("#wrPhoto"); if(ph) ph.onchange=e=>{ const f=e.target.files[0]; if(f) compressImageFile(f, d=>{ pendingVoice=null; $("#wrPrev").innerHTML=`<img src="${d}"/>`; window._photoData=d; }); };
    const rec=$("#wrRec"); if(rec) rec.onclick=()=>toggleVoiceRecord(rec);
  });
}
function paperForm(){
  const subFields=[
    ["言语","言语理解"],["资料","资料分析"],["图推","图形推理"],["逻辑","逻辑推理"],["定义类比","定义类比"],["数量","数量关系"],["常识","时政常识"]
  ];
  const rows=subFields.map(([k,label])=>`
    <div style="display:flex;align-items:center;gap:6px;margin:5px 0;">
      <span style="width:74px;font-size:12px;font-weight:700;color:#b06a90;">${label}</span>
      <input class="in" style="flex:1;" type="number" min="0" placeholder="题量" data-sub="${k}" data-f="t"/>
      <input class="in" style="flex:1;" type="number" min="0" placeholder="正确" data-sub="${k}" data-f="c"/>
    </div>`).join("");
  openModal(`
    <div class="modal-h">${svgIcon("add",14)} 录入套卷 <button class="x" data-action="closeModal">×</button></div>
    <div class="two">
      <div><label class="fld">做题日期</label><input class="in" id="ppDate" type="date" value="${todayStr()}"/></div>
      <div><label class="fld">套题来源</label><input class="in" id="ppSource" placeholder="如：2025真题"/></div>
    </div>
    <label class="fld">各科题量 / 正确数（自动算正确率）</label>
    ${rows}
    <div class="two">
      <div><label class="fld">用时（分钟）</label><input class="in" id="ppTime" type="number" min="0" placeholder="0"/></div>
      <div><label class="fld">总分</label><input class="in" id="ppScore" type="number" min="0" placeholder="手动填"/></div>
    </div>
    <div class="two">
      <div><label class="fld">击败率(%)</label><input class="in" id="ppBeat" type="number" min="0" placeholder="手动填"/></div>
      <div><label class="fld">总正确率</label><input class="in" id="ppAcc" readonly placeholder="自动计算" style="background:#fff4fa;color:#e56fa0;font-weight:800;"/></div>
    </div>
    <label class="fld">错题 & 遗忘知识点备注</label>
    <textarea class="in" id="ppNotes" placeholder="总结这套卷子的薄弱点与遗忘知识点…"></textarea>
    <button class="btn btn-pink btn-block" style="margin-top:14px;" data-action="savePaper">保存并分析 📈</button>
  `);
  // live accuracy
  const calc=()=>{
    let t=0,c=0;
    document.querySelectorAll("[data-sub]").forEach(inp=>{
      const v=+inp.value||0; if(inp.dataset.f==="t") t+=v; else c+=v;
    });
    $("#ppAcc").value = t? (c/t*100).toFixed(1)+"%" : "";
  };
  document.querySelectorAll("[data-sub]").forEach(inp=>inp.oninput=calc);
}

/* voice: recognition (text) */
let curRecognition=null;
function attachVoiceRec(){
  const btn=document.querySelector('[data-action="voiceInput"]');
  if(!btn) return;
  btn.onclick=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ toast("当前浏览器不支持语音识别，请手动输入～"); return; }
    if(curRecognition){ curRecognition.stop(); return; }
    const rec=new SR(); rec.lang="zh-CN"; rec.interimResults=false; rec.maxAlternatives=1;
    const ta=document.getElementById(btn.dataset.target);
    rec.onresult=e=>{ ta.value=(ta.value+" "+e.results[0][0].transcript).trim(); curRecognition=null; btn.textContent="🎤 语音输入"; };
    rec.onerror=()=>{ toast("语音识别结束"); curRecognition=null; btn.textContent="🎤 语音输入"; };
    rec.onend=()=>{ curRecognition=null; btn.textContent="🎤 语音输入"; };
    curRecognition=rec; btn.textContent="🔴 正在听…"; rec.start();
  };
}
/* voice: record (message) */
let mediaRec=null, mediaStream=null;
async function toggleVoiceRecord(btn){
  if(mediaRec && mediaRec.state==="recording"){
    mediaRec.stop(); return;
  }
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(mediaStream);
    const chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{
      const blob=new Blob(chunks); const r=new FileReader();
      r.onload=()=>{ pendingVoice=r.result; btn.classList.remove("recording"); btn.textContent="● 重新录制"; $("#wrPrev").innerHTML=`<div class="voice-bar"><button>▶</button><div class="voice-wave"><i></i><i></i><i></i><i></i><i></i></div><span style="font-size:11px;color:#9a4f74;">已录音</span></div>`; };
      r.readAsDataURL(blob);
      mediaStream.getTracks().forEach(t=>t.stop());
    };
    mr.start(); mediaRec=mr;
    btn.classList.add("recording"); btn.textContent="■ 停止录音";
  }catch(e){ toast("无法录音，请检查麦克风权限～"); }
}

/* photo compress */
function compressImageFile(file, cb){
  const reader=new FileReader();
  reader.onload=()=>compressImage(reader.result, 900, cb);
  reader.readAsDataURL(file);
}
function compressImage(src, maxW, cb){
  const img=new Image();
  img.onload=()=>{
    const scale=Math.min(1, maxW/img.width);
    const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",0.72));
  };
  img.src=src;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");
  if(!el) return;
  const a=el.dataset.action;
  if(a==="toggleNav"){ document.body.classList.toggle("nav-open"); return; }
  if(a==="closeModal"){ closeModal(); return; }
  if(a==="nav"){ currentView=el.dataset.view; ui.tab="plan"; document.body.classList.remove("nav-open"); render(); window.scrollTo(0,0); return; }
  if(a==="openSync"){ currentView="sync"; render(); window.scrollTo(0,0); return; }
  if(a==="openAdd"){
    const k=el.dataset.kind, mod=el.dataset.mod;
    if(k==="exam") examForm();
    else if(k==="plan") planForm(mod);
    else if(k==="record") recordForm(mod);
    else if(k==="wrong") wrongForm(mod);
    else if(k==="paper") paperForm();
    return;
  }
  if(a==="setPeriod"){ ui.period=el.dataset.period; render(); return; }
  if(a==="setMetric"){ ui.metric=el.dataset.metric; render(); return; }
  if(a==="subtab"){ ui.tab=el.dataset.tab; render(); return; }
  if(a==="togglePlan"){
    const m=state.modules[el.dataset.mod]; const p=m.plans.find(x=>x.id===el.dataset.pid);
    if(p){ p.done=!p.done; autoSave(); render(); } return;
  }
  if(a==="dailyCheckin"){
    const t=todayStr();
    if(state.dailyCheckins[t]) delete state.dailyCheckins[t]; else state.dailyCheckins[t]=true;
    autoSave(); render(); return;
  }
  if(a==="addCheckin"){
    const mod=el.dataset.mod, v=+$("#ckMin").value||0;
    if(v>0){ const t=todayStr(); state.modules[mod].checkins[t]=(state.modules[mod].checkins[t]||0)+v; autoSave(); render(); }
    return;
  }
  if(a==="toggleSync"){ state.sync.connected=!state.sync.connected; autoSave(); render(); toast(state.sync.connected?"已连接，开启同步模式 🌈":"已断开，仅本地保存"); return; }
  if(a==="exportData"){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a2=document.createElement("a");
    a2.href=url; a2.download="上岸计划备份_"+todayStr()+".json"; a2.click();
    URL.revokeObjectURL(url); toast("已导出备份 📤"); return;
  }
  if(a==="importData"){ $("#importFile").click(); return; }
  if(a==="saveExam"){ saveExam(); return; }
  if(a==="savePlan"){ savePlan(); return; }
  if(a==="saveRecord"){ saveRecord(el.dataset.mod); return; }
  if(a==="saveWrong"){ saveWrong(el.dataset.mod); return; }
  if(a==="savePaper"){ savePaper(); return; }
  if(a==="delExam"){ state.exams=state.exams.filter(x=>x.id!==el.dataset.id); autoSave(); render(); return; }
  if(a==="delPaper"){ state.papers=state.papers.filter(x=>x.id!==el.dataset.id); autoSave(); render(); return; }
  if(a==="del"){
    const {kind,mod,id}=el.dataset; const m=state.modules[mod];
    if(kind==="plan") m.plans=m.plans.filter(x=>x.id!==id);
    else if(kind==="record") m.records=m.records.filter(x=>x.id!==id);
    else if(kind==="wrong") m.wrongs=m.wrongs.filter(x=>x.id!==id);
    else if(kind==="checkin") delete m.checkins[id];
    autoSave(); render(); return;
  }
});

/* import file handling */
document.addEventListener("change",e=>{
  if(e.target.id==="importFile"){
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(data && data.modules){ state=data; saveState(); render(); toast("导入成功 🎉"); }
        else toast("文件格式不对哦～");
      }catch(err){ toast("导入失败：不是有效的备份文件"); }
    };
    r.readAsText(f);
  }
});

/* save handlers */
function saveExam(){
  const name=$("#exName").value.trim(), date=$("#exDate").value, type=$("#exType").value;
  if(!name||!date){ toast("请填写名称和日期"); return; }
  state.exams.push({id:uid(),name,date,type});
  autoSave(); closeModal(); render();
}
function savePlan(){
  const mod=$("#plMod").value, text=$("#plText").value.trim(), date=$("#plDate").value||todayStr();
  if(!text){ toast("写点计划内容吧～"); return; }
  state.modules[mod].plans.push({id:uid(),text,date,done:false});
  autoSave(); closeModal(); if(currentView===mod||currentView==="daily") render(); else render();
}
function saveRecord(mod){
  const date=$("#rcDate").value||todayStr();
  const count=+$("#rcCount").value||0, correct=+$("#rcCorrect").value||0, time=+$("#rcTime").value||0;
  if(count<=0){ toast("填写做题数哦～"); return; }
  state.modules[mod].records.push({id:uid(),date,count,correct,time});
  autoSave(); closeModal(); render();
}
function saveWrong(mod){
  const type=document.querySelector("#wrPicker .active").dataset.type;
  const date=$("#wrDate").value||todayStr();
  const note=$("#wrNote").value.trim();
  let text="", media=null;
  if(type==="text"){ text=$("#wrText").value.trim(); if(!text){ toast("写点内容吧～"); return; } }
  else if(type==="photo"){ media=window._photoData||null; text="[图片错题]"; if(!media){ toast("先拍张照哦～"); return; } }
  else { media=pendingVoice||null; text="[语音错题]"; if(!media){ toast("先录段语音哦～"); return; } }
  state.modules[mod].wrongs.push({id:uid(),date,type,text,note,media});
  window._photoData=null; pendingVoice=null;
  autoSave(); closeModal(); render();
}
function savePaper(){
  const date=$("#ppDate").value||todayStr();
  const source=$("#ppSource").value.trim();
  const time=+$("#ppTime").value||0, totalScore=+$("#ppScore").value||0, beatRate=+$("#ppBeat").value||0;
  const notes=$("#ppNotes").value.trim();
  const subs={};
  ["言语","资料","图推","逻辑","定义类比","数量","常识"].forEach(k=>{
    const t=+document.querySelector(`[data-sub="${k}"][data-f="t"]`).value||0;
    const c=+document.querySelector(`[data-sub="${k}"][data-f="c"]`).value||0;
    subs[k]={t,c};
  });
  state.papers.push({id:uid(),date,source,time,totalScore,beatRate,notes,subs});
  autoSave(); closeModal(); render();
}
